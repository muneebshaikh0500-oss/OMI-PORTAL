<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Advanced Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { border-collapse: collapse; width: 100%; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px 8px; text-align: left; white-space: nowrap; }
        th { background: #f8fafc; position: sticky; top: 0; z-index: 10; color: #475569; }
        tr:nth-child(even) { background-color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="loginPage" class="flex items-center justify-center min-h-screen bg-slate-900 p-6">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-8">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-blue-500/50">
                    <i class="fas fa-hospital-user text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">OMI PORTAL</h1>
                <p class="text-slate-400 text-sm">Secure Access Gateway</p>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-4 text-slate-400"></i>
                    <input type="text" id="userID" placeholder="User ID" class="w-full pl-12 p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-4 text-slate-400"></i>
                    <input type="password" id="userPass" placeholder="Password" class="w-full pl-12 p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl mt-6 hover:bg-blue-700 active:scale-95 transition-all shadow-lg">Sign In</button>
            
            <div class="flex justify-between mt-6 text-sm">
                <button onclick="biometricLogin()" class="text-blue-600 font-semibold flex items-center gap-2">
                    <i class="fas fa-fingerprint text-lg"></i> Biometric
                </button>
                <button onclick="forgetPass()" class="text-slate-500 hover:text-blue-600">Forget Password?</button>
            </div>
        </div>
    </div>

    <div id="mainPage" class="hidden animate-in fade-in duration-500">
        <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                    <span class="w-2 h-8 bg-blue-600 rounded-full"></span>
                    PATIENT DATABASE
                </h2>
                <div class="relative w-full md:w-80">
                    <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="search" onkeyup="render()" placeholder="Search patient name..." class="w-full pl-10 p-2.5 border border-slate-200 rounded-full outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="location.reload()" class="bg-slate-100 p-2.5 rounded-full hover:bg-slate-200">
                    <i class="fas fa-sign-out-alt text-slate-600"></i>
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4 md:p-6">
            <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
                <div class="table-container max-h-[75vh]">
                    <table id="dataTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="ownerTools" class="hidden mt-8 p-6 bg-white rounded-2xl shadow-lg border-2 border-dashed border-blue-200">
                <div class="flex items-center gap-3 mb-4">
                    <i class="fas fa-cloud-upload-alt text-blue-600 text-2xl"></i>
                    <h3 class="font-bold text-slate-800 text-lg">Update Cloud Data</h3>
                </div>
                <textarea id="excelData" placeholder="Excel data yahan paste karen (Ctrl+V)..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl h-40 text-xs mb-4 outline-none focus:bg-white transition-all"></textarea>
                <button onclick="upload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-500/30">Sync Now</button>
            </div>
        </main>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyB60b1DuLBjAHRXV0SqE6U0vf1aTD0UtZ8",
            authDomain: "omi-patient-portal-750f3.firebaseapp.com",
            projectId: "omi-patient-portal-750f3",
            databaseURL: "https://omi-patient-portal-750f3-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let allData = [];

        // LOGIN SYSTEM
        function login() {
            const u = document.getElementById('userID').value;
            const p = document.getElementById('userPass').value;
            if((u==='owner' && p==='1234') || (u==='user' && p==='user123')) {
                enterPortal(u);
            } else { alert("Invalid Credentials!"); }
        }

        function enterPortal(role) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            if(role==='owner') document.getElementById('ownerTools').classList.remove('hidden');
            initSync();
        }

        // FINGERPRINT (BIOMETRIC)
        async function biometricLogin() {
            if (window.PublicKeyCredential) {
                try {
                    // Note: Yeh tabhi fully work karega jab apka user pehle se registered ho.
                    // Filhal hum simulation kar rahe hain device support ki.
                    alert("Fingerprint Sensor Active... Apni ungli scan karen.");
                    // Yahan security logic ata hai, demo ke liye hum owner login karwa dete hain
                    enterPortal('owner');
                } catch (e) {
                    alert("Biometric Failed or Not Set up.");
                }
            } else {
                alert("Biometric not supported on this device/browser.");
            }
        }

        // FORGET PASSWORD
        function forgetPass() {
            const pin = prompt("Security PIN enter karen (Default: 0000):");
            if(pin === "0000") {
                alert("Apka Admin Password: 1234\nUser Password: user123");
            } else {
                alert("Wrong Security PIN!");
            }
        }

        // DATA HANDLERS
        function initSync() {
            db.ref('omi_full_data').on('value', (snap) => {
                allData = snap.val() || [];
                render();
            });
        }

        function upload() {
            const txt = document.getElementById('excelData').value;
            if(!txt) return alert("Paste Excel data first!");
            const rows = txt.trim().split('\n').map(r => r.split('\t'));
            db.ref('omi_full_data').set(rows).then(() => {
                alert("Success! " + rows.length + " rows uploaded.");
                document.getElementById('excelData').value = "";
            });
        }

        function render() {
            const head = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            const q = document.getElementById('search').value.toUpperCase();
            head.innerHTML = ""; body.innerHTML = "";
            if(!allData.length) return;

            head.innerHTML = `<tr>${allData[0].map(h => `<th>${h}</th>`).join('')}</tr>`;
            for(let i=1; i<allData.length; i++) {
                if(allData[i].some(cell => cell.toUpperCase().includes(q))) {
                    body.innerHTML += `<tr>${allData[i].map(c => `<td>${c||'-'}</td>`).join('')}</tr>`;
                }
            }
        }
    </script>
</body>
</html>

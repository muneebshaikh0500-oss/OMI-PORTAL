<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Real-time Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
</head>
<body class="max-w-md mx-auto shadow-2xl bg-slate-50 min-h-screen">

    <div id="loginPage" class="p-8 flex flex-col justify-center min-h-screen bg-slate-900">
        <h1 class="text-white text-3xl font-black text-center mb-10 italic">OMI PORTAL</h1>
        <input type="text" id="userID" placeholder="ID (owner / user)" class="w-full p-4 mb-4 rounded-xl bg-white/10 text-white outline-none border border-white/20">
        <input type="password" id="userPass" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-white/10 text-white outline-none border border-white/20">
        <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">Sign In</button>
    </div>

    <div id="mainPage" class="hidden">
        <header class="bg-blue-600 text-white p-6 sticky top-0 z-50 shadow-md">
            <div class="flex justify-between items-center mb-4 text-xs font-bold uppercase tracking-widest">
                <span>Patient Directory</span>
                <span id="pCount">0 Loaded</span>
            </div>
            <input type="text" id="search" onkeyup="render()" placeholder="Search Patient Name..." class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-blue-100 outline-none border border-white/30">
        </header>
        <div id="list" class="p-4 space-y-3 pb-24"></div>
        
        <div id="ownerTools" class="hidden p-4 bg-white border-t fixed bottom-0 w-full max-w-md">
            <textarea id="excelData" placeholder="Excel se data yahan paste karein..." class="w-full p-3 bg-slate-100 rounded-lg text-[10px] h-20 outline-none mb-2"></textarea>
            <button onclick="upload()" class="w-full bg-black text-white py-3 rounded-lg font-bold">Update Cloud</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB60b1DuLBjAHRXV0SqE6U0vf1aTD0UtZ8",
            authDomain: "omi-patient-portal-750f3.firebaseapp.com",
            projectId: "omi-patient-portal-750f3",
            databaseURL: "https://omi-patient-portal-750f3-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let patients = [];

        function login() {
            const u = document.getElementById('userID').value;
            const p = document.getElementById('userPass').value;
            if((u==='owner' && p==='1234') || (u==='user' && p==='user123')) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                if(u==='owner') document.getElementById('ownerTools').classList.remove('hidden');
                initSync();
            } else { alert("Wrong ID/Pass"); }
        }

        function initSync() {
            db.ref('patients').on('value', (snap) => {
                patients = snap.val() || [];
                document.getElementById('pCount').innerText = patients.length + " Patients";
                render();
            });
        }

        function upload() {
            const txt = document.getElementById('excelData').value;
            const rows = txt.split('\n');
            let temp = [];
            rows.forEach(r => {
                const c = r.split('\t');
                if(c.length > 5) temp.push({pno:c[1], name:c[2], panel:c[3], total:c[28]||"0", status:c[c.length-1].trim()});
            });
            db.ref('patients').set(temp).then(() => {
                alert("Cloud Updated!");
                document.getElementById('excelData').value = "";
            });
        }

        function render() {
            const list = document.getElementById('list');
            const q = document.getElementById('search').value.toUpperCase();
            list.innerHTML = "";
            patients.filter(p => p.name.toUpperCase().includes(q)).forEach(p => {
                const isDis = p.status.includes("DISCHARGED");
                list.innerHTML += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div><h4 class="font-bold text-sm uppercase">${p.name}</h4><p class="text-[9px] text-slate-400 font-bold">${p.panel} | P#${p.pno}</p></div>
                    <div class="text-right"><p class="text-blue-700 font-black text-sm">Rs. ${p.total}</p>
                    <span class="text-[8px] font-bold px-2 py-0.5 rounded ${isDis?'bg-green-100 text-green-600':'bg-orange-100 text-orange-600'}">${p.status}</span></div>
                </div>`;
            });
        }
    </script>
</body>
</html>

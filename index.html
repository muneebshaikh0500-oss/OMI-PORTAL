<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Full Data Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        .table-container { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; font-size: 11px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; white-space: nowrap; }
        th { bg-color: #f3f4f6; position: sticky; top: 0; background: white; }
        tr:nth-child(even) { background-color: #f9fafb; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="loginPage" class="flex items-center justify-center min-h-screen bg-slate-900 p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h1 class="text-2xl font-black text-center mb-6 text-slate-800 italic">OMI DATA PORTAL</h1>
            <input type="text" id="userID" placeholder="ID (owner / user)" class="w-full p-3 mb-4 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="userPass" placeholder="Password" class="w-full p-3 mb-6 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Login</button>
        </div>
    </div>

    <div id="mainPage" class="hidden p-4">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h2 class="text-xl font-bold text-slate-800">Live Patient Sheet</h2>
            <input type="text" id="search" onkeyup="render()" placeholder="Search patient name..." class="p-2 border rounded-lg w-full md:w-64 outline-none">
        </div>

        <div class="bg-white shadow-lg rounded-xl overflow-hidden">
            <div class="table-container max-h-[70vh]">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="ownerTools" class="hidden mt-6 bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
            <h3 class="font-bold mb-2">Update Data (Excel se copy karke yahan paste karein)</h3>
            <textarea id="excelData" placeholder="Excel ki saari rows aur columns copy karein..." class="w-full p-3 bg-slate-50 border rounded-lg h-32 text-xs mb-3 outline-none"></textarea>
            <button onclick="upload()" class="bg-black text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 transition">Sync All Data</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB60b1DuLBjAHRXV0SqE6U0vf1aTD0UtZ8",
            authDomain: "omi-patient-portal-750f3.firebaseapp.com",
            projectId: "omi-patient-portal-750f3",
            databaseURL: "https://omi-patient-portal-750f3-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let allData = [];

        function login() {
            const u = document.getElementById('userID').value;
            const p = document.getElementById('userPass').value;
            if((u==='owner' && p==='1234') || (u==='user' && p==='user123')) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                if(u==='owner') document.getElementById('ownerTools').classList.remove('hidden');
                initSync();
            } else { alert("Ghalat ID ya Password!"); }
        }

        function initSync() {
            db.ref('omi_data').on('value', (snap) => {
                allData = snap.val() || [];
                render();
            });
        }

        function upload() {
            const txt = document.getElementById('excelData').value;
            if(!txt) return alert("Pehle data paste karein!");
            
            const rows = txt.trim().split('\n');
            const formattedData = rows.map(row => row.split('\t')); // Saare columns split karega
            
            db.ref('omi_data').set(formattedData).then(() => {
                alert("Cloud Updated! " + (rows.length) + " rows synced.");
                document.getElementById('excelData').value = "";
            });
        }

        function render() {
            const head = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            const q = document.getElementById('search').value.toUpperCase();
            
            head.innerHTML = "";
            body.innerHTML = "";

            if(allData.length === 0) return;

            // Row 1 ko heading bana dein
            let headHTML = "<tr>";
            allData[0].forEach(h => headHTML += `<th>${h}</th>`);
            headHTML += "</tr>";
            head.innerHTML = headHTML;

            // Baki saari rows data ke liye
            for(let i = 1; i < allData.length; i++) {
                const row = allData[i];
                // Search filter (sirf Name wale column par, jo ke column index 2 hota hai aksar)
                if(row[2] && row[2].toUpperCase().includes(q)) {
                    let rowHTML = "<tr>";
                    row.forEach(cell => rowHTML += `<td>${cell || '-'}</td>`);
                    rowHTML += "</tr>";
                    body.innerHTML += rowHTML;
                }
            }
        }
    </script>
</body>
</html>
